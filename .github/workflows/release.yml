name: Release

# Pushing a tag like v2.0.0 builds the plugin, publishes a GitHub Release with latest.zip,
# writes repo.json on master, and tells pearstopher/ffxiv-plugins (the combined custom repo
# players add in game) to rebuild its plugin list.
on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dalamudHome = Join-Path $env:RUNNER_TEMP "dalamud"
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip $dalamudHome
          "DALAMUD_HOME=$dalamudHome" >> $env:GITHUB_ENV

      - name: Check the tag matches the csproj version
        shell: pwsh
        run: |
          # v2.0.0 -> 2.0.0.0 (Dalamud uses four-part assembly versions)
          $expected = "$env:GITHUB_REF_NAME".TrimStart('v') + ".0"
          $actual = (Select-Xml -Path Dalamud.DiscordBridge/Dalamud.DiscordBridge.csproj -XPath '//Version').Node.InnerText.Trim()
          if ($actual -ne $expected) {
            Write-Output "::error::Tag $env:GITHUB_REF_NAME needs <Version>$expected</Version> in Dalamud.DiscordBridge.csproj, but it says $actual. Bump the csproj, then tag that commit."
            exit 1
          }
          Write-Output "Version $actual matches tag $env:GITHUB_REF_NAME"

      - name: Build
        run: dotnet build Dalamud.DiscordBridge.sln --configuration Release

      - name: Test
        run: dotnet test Dalamud.DiscordBridge.sln --configuration Release --no-build

      - name: Publish GitHub Release
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Dalamud.DiscordBridge/bin/x64/Release/DiscordChatPears/latest.zip --title "Discord Chat Pears ${{ github.ref_name }}" --generate-notes

      - name: Update repo.json on master
        shell: pwsh
        run: |
          git fetch origin master
          git checkout -B master origin/master
          python .github/scripts/make_repo_json.py Dalamud.DiscordBridge/bin/x64/Release/DiscordChatPears/DiscordChatPears.json "$env:GITHUB_REF_NAME" "$env:GITHUB_REPOSITORY" repo.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "Update repo.json for $env:GITHUB_REF_NAME [skip ci]"
          git push origin master

      # Tell the combined plugin repo to rebuild its list now that repo.json is pushed.
      - name: Notify ffxiv-plugins
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
        run: gh api repos/pearstopher/ffxiv-plugins/dispatches -f event_type=plugin-updated
